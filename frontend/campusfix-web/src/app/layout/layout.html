<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" [class.sidebar-open]="menuOpen">

    <div class="sidebar-brand">
      <div class="brand-mark">CF</div>
      <div class="brand-text">
        <strong>CampusFix</strong>
        <span>Mantenimiento universitario</span>
      </div>
    </div>

    <div class="sidebar-section">
      <span class="section-title">PRINCIPAL</span>

      <nav class="main-navigation">
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
          (click)="closeMenu()"
        >
          <span class="nav-icon">⌂</span>
          <span>Dashboard</span>
        </a>

        <a
          routerLink="/reportes"
          routerLinkActive="active"
          class="nav-item"
          (click)="closeMenu()"
        >
          <span class="nav-icon">▤</span>
          <span>Reportes</span>
        </a>
      </nav>
    </div>

    @if (role === 'Administrador') {
      <div class="sidebar-section">
        <span class="section-title">ADMINISTRACIÓN</span>

        <nav class="main-navigation">
          <a routerLink="/usuarios" routerLinkActive="active" class="nav-item" (click)="closeMenu()">
            <span class="nav-icon">♙</span>
            <span>Usuarios</span>
          </a>

          <a routerLink="/tecnicos" routerLinkActive="active" class="nav-item" (click)="closeMenu()">
            <span class="nav-icon">⚒</span>
            <span>Técnicos</span>
          </a>

          <a routerLink="/categorias" routerLinkActive="active" class="nav-item" (click)="closeMenu()">
            <span class="nav-icon">◇</span>
            <span>Categorías</span>
          </a>

          <a routerLink="/ubicaciones" routerLinkActive="active" class="nav-item" (click)="closeMenu()">
            <span class="nav-icon">⌖</span>
            <span>Ubicaciones</span>
          </a>

          <a routerLink="/historial" routerLinkActive="active" class="nav-item" (click)="closeMenu()">
            <span class="nav-icon">◷</span>
            <span>Historial</span>
          </a>
        </nav>
      </div>
    }

    @if (role === 'Técnico') {
      <div class="sidebar-section">
        <span class="section-title">OPERACIÓN</span>

        <nav class="main-navigation">
          <a routerLink="/reportes/asignados" routerLinkActive="active" class="nav-item" (click)="closeMenu()">
            <span class="nav-icon">⚒</span>
            <span>Reportes asignados</span>
          </a>

          <a routerLink="/historial" routerLinkActive="active" class="nav-item" (click)="closeMenu()">
            <span class="nav-icon">◷</span>
            <span>Historial</span>
          </a>
        </nav>
      </div>
    }

    <div class="sidebar-bottom">
      <a routerLink="/perfil" routerLinkActive="active" class="nav-item" (click)="closeMenu()">
        <span class="nav-icon">♙</span>
        <span>Mi perfil</span>
      </a>

      <button type="button" class="logout-button" (click)="logout()">
        <span class="nav-icon">↪</span>
        <span>Cerrar sesión</span>
      </button>
    </div>

  </aside>

  @if (menuOpen) {
    <button
      type="button"
      class="sidebar-overlay"
      aria-label="Cerrar menú"
      (click)="closeMenu()"
    ></button>
  }

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-area">

    <header class="topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="mobile-menu-button"
          aria-label="Abrir menú"
          (click)="toggleMenu()"
        >
          ☰
        </button>

        <div class="page-brand">
          <span class="page-brand-dot"></span>
          <span>CampusFix</span>
        </div>
      </div>

      <!-- SOLO NOTIFICACIONES -->
      <div class="topbar-right">
        <button
          type="button"
          class="notification-button"
          title="Notificaciones"
          aria-label="Notificaciones"
        >
          ♢
          <span class="notification-dot"></span>
        </button>
      </div>
    </header>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>

    <!-- AYUDA FLOTANTE POR WHATSAPP -->
    <a
      class="floating-help"
      href="https://wa.me/593985853517"
      target="_blank"
      rel="noopener noreferrer"
      title="Contactar por WhatsApp"
      aria-label="Contactar por WhatsApp"
    >
      <span>✆</span>
    </a>

  </div>
</div>
